name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            AiVision/requirements.txt
            unified_backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r AiVision/requirements.txt -r unified_backend/requirements.txt
          python -m pip install "httpx>=0.27,<1.0" "pytest>=8,<9" "ruff>=0.5,<1.0"

      - name: Verify credential templates
        run: |
          grep -qx 'WECHAT_CORP_ID=replace-with-wechat-corp-id' AiVision/.env.example
          grep -qx 'WECHAT_CORP_SECRET=replace-with-wechat-corp-secret' AiVision/.env.example

      - name: Ruff
        run: ruff check AiVision unified_backend

      - name: AiVision tests
        working-directory: AiVision
        run: python -m pytest -q

      - name: Unified backend tests
        run: PYTHONPATH=. python -m pytest -q unified_backend/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unified_frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: unified_frontend/package-lock.json

      - run: npm ci
      - name: Contract tests
        run: node --test tests/*.test.mjs
      - run: npm run lint
      - run: npm run build
