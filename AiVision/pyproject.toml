[project]
name = "aivision-backend"
version = "2.0.0"
description = "Refactored AiVision backend with features-first architecture and FastAPI API."
requires-python = ">=3.10,<3.12"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "python-dotenv>=1.0,<2.0",
    "sqlalchemy>=2.0,<3.0",
    "pymysql>=1.1,<2.0",
    "apscheduler>=3.10,<4.0",
    "pytz>=2024.1",
    "opencv-python>=4.8,<5.0",
    "numpy>=1.24,<3.0",
    "PyYAML>=6.0,<7.0",
    "ultralytics>=8.0,<9.0",
    "requests>=2.31,<3.0",
    "setproctitle>=1.3,<2.0",
    "timm>=1.0,<2.0",
]

[project.optional-dependencies]
# 固定 InsightFace 的 NumPy ABI；OpenCV 两个发行包均需使用支持 NumPy 1 的版本。
face-cpu = [
    "insightface==0.7.3", "numpy==1.26.4", "onnx==1.17.0", "onnxruntime==1.20.1",
    "opencv-python==4.11.0.86", "opencv-python-headless==4.11.0.86", "albumentations==1.4.3",
]
face-gpu = [
    "insightface==0.7.3", "numpy==1.26.4", "onnx==1.17.0", "onnxruntime-gpu==1.20.1",
    "opencv-python==4.11.0.86", "opencv-python-headless==4.11.0.86", "albumentations==1.4.3",
]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
    "ruff>=0.5,<1.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
