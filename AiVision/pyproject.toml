[project]
name = "aivision-backend"
version = "2.0.0"
description = "Refactored AiVision backend with features-first architecture and FastAPI API."
requires-python = ">=3.10,<3.12"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "python-dotenv>=1.0,<2.0",
    "sqlalchemy>=2.0,<3.0",
    "pymysql>=1.1,<2.0",
    "apscheduler>=3.10,<4.0",
    "pytz>=2024.1",
    "opencv-python>=4.8,<5.0",
    "pillow>=10.0,<13.0",
    "numpy>=1.24,<3.0",
    "PyYAML>=6.0,<7.0",
    # ByteTrack 本地 ID 扩展依赖上游 API，固定为已通过真实跟踪测试的版本组合。
    "ultralytics==8.4.124",
    "lap==0.5.13",
    "requests>=2.31,<3.0",
    "setproctitle>=1.3,<2.0",
    "timm>=1.0,<2.0",
]

[project.optional-dependencies]
# InsightFace 1.0.1 基础推理使用纯 Python wheel，沿用项目的 NumPy 与 opencv-python。
# 不安装 gui/face3d extra；基础推理不需要 Cython、albumentations 或 headless OpenCV。
face-cpu = [
    "insightface==1.0.1", "onnx==1.20.1", "onnxruntime==1.20.1",
]
# 正式 GPU 环境：Python 3.11、PyTorch CUDA 13、cuDNN 9。
# 上游强制依赖 CPU onnxruntime，pip 无法用 GPU 包替代该依赖声明。
# GPU 部署必须分步：安装 InsightFace 和依赖，卸载 CPU Runtime，最后安装 GPU Runtime。
# 不要直接一次安装此 extra，否则会同时安装两种 Runtime；替换后 pip check 会提示上游缺少 CPU 包。
face-gpu = [
    "insightface==1.0.1", "onnx==1.20.1", "onnxruntime-gpu==1.27.0",
]
dev = [
    "httpx>=0.27,<1.0",
    "ruff>=0.5,<1.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"
