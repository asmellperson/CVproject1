# AiVision 本机模型路径覆盖示例。
# 复制为 model_paths.yaml 后按当前服务器的真实路径修改。
#
# 数据库 ai_model.path 仍保留用于模型元数据和旧接口兼容；
# 推理 worker 实际加载时优先使用此文件中按模型 name 配置的 path。
models:
  yolo_human:
    path: /path/to/person_phone.pt
  yolo_phone:
    path: /path/to/person_phone.pt
  yolo_face:
    path: /path/to/yolov8x-face.pt
