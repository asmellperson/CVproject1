# AiVision 本机模型路径配置示例。
# 复制为 model_paths.yaml 后按当前服务器的真实路径修改。
#
# 模型身份及推理参数由代码固定注册；
# 推理 worker 只使用此文件中按模型 name 配置的 path。
models:
  yolo_human:
    path: /path/to/person_phone.pt
  yolo_phone:
    path: /path/to/person_phone.pt
  yolo_face:
    path: /path/to/yolov8x-face.pt
  # buffalo_l 解压目录，包含完整的五个 ONNX 文件；应用不会联网下载。
  insightface:
    path: /srv/models/insightface/buffalo_l
