# 福达视觉平台生产 Nginx 示例
#
# 用途：
#   Nginx 负责承载前端 dist，并把 API / 视频流路径转发到统一后端。
#
# 注意：
#   运维网关/防火墙只需要开放 80/443 到本机 Nginx。
#   3000/5000/7862 都不要对公网开放。
#
# 内部服务不要对公网开放：
#   unified_backend 127.0.0.1:5000
#   AiVision（含 Guard Room / Security VLM）127.0.0.1:7862
#
# 安装位置示例：
#   /etc/nginx/conf.d/aicv-unified-backend.conf
#
# 生效命令：
#   nginx -t
#   systemctl reload nginx

server {
    listen 80;
    server_name aicv.fudar.com _;

    root /usr/zyy/Fuda_CVPreject_V3/unified_frontend/dist;
    index index.html;

    client_max_body_size 100m;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 30s;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /aivision/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /security-vlm/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
