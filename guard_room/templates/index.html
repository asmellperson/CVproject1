<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guard Room Simple Console</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background:#0f172a; color:#e2e8f0; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .row { display:flex; gap:16px; flex-wrap:wrap; }
    .card { background:#111827; border:1px solid #334155; border-radius:12px; padding:16px; margin-bottom:16px; }
    input, button, select { padding:10px 12px; border-radius:8px; border:1px solid #475569; background:#0b1220; color:#e2e8f0; }
    button { cursor:pointer; background:#2563eb; border:none; }
    button.secondary { background:#475569; }
    img { max-width:100%; border-radius:12px; border:1px solid #334155; }
    pre { white-space:pre-wrap; word-break:break-word; background:#020617; padding:12px; border-radius:8px; overflow:auto; }
    .grow { flex:1; min-width:280px; }
    .grid { display:grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap:12px; }
    .stat { background:#020617; border:1px solid #334155; border-radius:10px; padding:12px; }
    .label { color:#94a3b8; font-size:12px; }
    .value { font-size:24px; font-weight:700; }
    table { width:100%; border-collapse: collapse; }
    th, td { border-bottom:1px solid #334155; padding:8px; text-align:left; font-size:14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h2>保安室简版控制台</h2>
      <div class="row">
        <input id="backend" class="grow" value="http://127.0.0.1:5000" />
        <button onclick="saveBackend()">保存地址</button>
        <button onclick="startAlgo()">启动算法</button>
        <button class="secondary" onclick="stopAlgo()">停止算法</button>
      </div>
    </div>

    <div class="grid card">
      <div class="stat"><div class="label">运行状态</div><div class="value" id="running">-</div></div>
      <div class="stat"><div class="label">FPS</div><div class="value" id="fps">-</div></div>
      <div class="stat"><div class="label">总帧数</div><div class="value" id="frame_count">-</div></div>
      <div class="stat"><div class="label">最近报警</div><div class="value" id="last_alarm">-</div></div>
    </div>

    <div class="card">
      <h3>实时画面</h3>
      <img id="frame" alt="frame" />
    </div>

    <div class="row">
      <div class="card grow">
        <h3>报警记录</h3>
        <table>
          <thead><tr><th>ID</th><th>类型</th><th>时间</th><th>原因</th></tr></thead>
          <tbody id="alarms"></tbody>
        </table>
      </div>
      <div class="card grow">
        <h3>统计分析</h3>
        <pre id="stats"></pre>
      </div>
    </div>
  </div>
<script>
  const backendInput = document.getElementById('backend');
  const params = new URLSearchParams(location.search);
  backendInput.value = params.get('backend') || localStorage.getItem('guard_backend') || backendInput.value;
  function base(){ return backendInput.value.replace(/\/$/, ''); }
  function saveBackend(){ localStorage.setItem('guard_backend', backendInput.value); refreshAll(); }
  async function jget(path){ const r = await fetch(base()+path); return r.json(); }
  async function jpost(path){ const r = await fetch(base()+path, {method:'POST'}); return r.json(); }
  async function startAlgo(){ await jpost('/api/control/start'); refreshAll(); }
  async function stopAlgo(){ await jpost('/api/control/stop'); refreshAll(); }
  async function refreshStatus(){
    try {
      const s = await jget('/api/status');
      document.getElementById('running').textContent = String(s.running);
      document.getElementById('fps').textContent = String(s.fps ?? '-');
      document.getElementById('frame_count').textContent = String(s.frame_count ?? '-');
      document.getElementById('last_alarm').textContent = s.last_alarm?.event_type || '-';
      document.getElementById('frame').src = base() + '/api/frame.jpg?t=' + Date.now();
    } catch (e) { console.error(e); }
  }
  async function refreshAlarms(){
    try {
      const data = await jget('/api/alarms?limit=20');
      const items = Array.isArray(data) ? data : (data.items || []);
      const tbody = document.getElementById('alarms');
      tbody.innerHTML = items.map(x => `<tr><td>${x.id||''}</td><td>${x.event_type||''}</td><td>${x.created_at||''}</td><td>${x.reason||''}</td></tr>`).join('');
    } catch (e) { console.error(e); }
  }
  async function refreshStats(){
    try {
      const data = await jget('/api/statistics');
      document.getElementById('stats').textContent = JSON.stringify(data, null, 2);
    } catch (e) { console.error(e); }
  }
  function refreshAll(){ refreshStatus(); refreshAlarms(); refreshStats(); }
  refreshAll();
  setInterval(refreshStatus, 1000);
  setInterval(refreshAlarms, 5000);
  setInterval(refreshStats, 5000);
</script>
</body>
</html>
