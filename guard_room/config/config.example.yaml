models:
  detector_model: models/person_phone.pt
  vehicle_detector_model: yolo11n.pt
  uniform_cls_model: models/uniform_classes.pt
  pose_model_task: models/yolo11n-pose.engine
  detector_conf: 0.25
  phone_conf: 0.35
  vehicle_conf: 0.35
  detector_iou: 0.45
  detector_imgsz: 960
  vehicle_imgsz: 960
  phone_crop_imgsz: 640
  phone_full_frame_imgsz: 960
  pose_imgsz: 640
  use_half: true
  tracker: bytetrack.yaml
  device: '0'
  uniform_cls_imgsz: 224
  uniform_cls_conf: 0.8
room:
  frame_width: 1920
  frame_height: 1080
rules:
  absent_seconds: 60
  phone_seconds: 3.7
  prone_sleep_seconds: 300
  vehicle_occlusion_seconds: 2
  phone_near_person_px: 250
  phone_near_head_px: 160
  vehicle_near_px: 160
  vehicle_roi:
    - [0.0, 0.0]
    - [1.0, 0.0]
    - [1.0, 1.0]
    - [0.0, 1.0]
  vehicle_exit_direction: any
  vehicle_direction_min_delta_ratio: 0.03
  static_motion_threshold: 8
  prone_head_down_ratio_threshold: 0.22
  prone_bbox_height_ratio_threshold: 0.18
  prone_consecutive_frames: 8
  state_ttl_seconds: 20
  phone_window_seconds: 5
  phone_min_hits_in_window: 5
  phone_grace_seconds: 3
  guard_hold_seconds: 1.3
  dual_sync_seconds: 1.5
  absent_alarm_seconds: 60
  alarm_cooldown_absent: 540
  alarm_cooldown_phone: 1200
  alarm_cooldown_prone_sleep: 300
  alarm_cooldown_vehicle_unattended: 300
classes:
  person: 0
  play_phone: 1
  vehicle_bicycle: 1
  vehicle_car: 2
  vehicle_motorcycle: 3
runtime:
  show_window: false
  debug: true
  draw_debug: false
  max_alarm_history: 1000
  infer_max_workers: 1
  share_phone_detector: true
  share_pose_estimator: true
  phone_detect_mode: guard_crop
  enable_vehicle_unattended: true
  vehicle_camera_id: cam1
wechat:
