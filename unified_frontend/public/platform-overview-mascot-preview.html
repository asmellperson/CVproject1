<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>平台总览吉祥物预览</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 32px;
        color: #061d45;
        font-family: "Microsoft YaHei", system-ui, sans-serif;
        background: linear-gradient(180deg, #f8fbff, #eef4fb 48%, #f8fafc);
      }
      .note { margin: 0 0 14px; color: #52657e; font-size: 14px; }
      .banner {
        position: relative;
        min-height: 280px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, .8);
        border-radius: 18px;
        background: #dcecff url('/company-home-bg.jpg') center / cover;
        box-shadow: 0 22px 54px rgba(15, 44, 92, .16);
      }
      .banner::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, rgba(232,242,255,.94) 0%, rgba(222,236,255,.66) 38%, rgba(218,235,255,.08) 72%);
      }
      .content {
        position: relative;
        z-index: 1;
        display: flex;
        min-height: 280px;
        padding: 28px 56px 28px 390px;
        align-items: center;
      }
      .badge {
        display: inline-block;
        margin-bottom: 16px;
        padding: 5px 12px;
        border: 1px solid #bfdbfe;
        border-radius: 999px;
        background: rgba(255, 255, 255, .78);
        font-size: 14px;
        font-weight: 600;
      }
      h1 { margin: 0; font-size: clamp(30px, 4vw, 48px); }
      .mascot {
        position: absolute;
        z-index: 2;
        inset-block: 0;
        left: 0;
        display: flex;
        width: 40%;
        max-width: 560px;
        justify-content: center;
      }
      .mascot video {
        display: block;
        width: 100%;
        height: 100%;
        opacity: .3;
        mix-blend-mode: multiply;
        object-fit: cover;
        object-position: right center;
        mask-image: linear-gradient(to right, #000 0%, #000 28%, transparent 100%);
        -webkit-mask-image: linear-gradient(to right, #000 0%, #000 28%, transparent 100%);
      }
      @media (max-width: 767px) {
        body { padding: 16px; }
        .banner, .content { min-height: 240px; }
        .content { padding: 24px 24px 24px 170px; }
        .mascot { display: none; }
      }
    </style>
  </head>
  <body>
    <p class="note">预览：H.264 蓝白调色版，左下角嵌入；白底以混合模式融合到横幅背景。</p>
    <section class="banner">
      <div class="content">
        <div>
          <span class="badge">综合管理部</span>
          <h1>福达 AI 视觉安全监管平台</h1>
        </div>
      </div>
      <div class="mascot">
        <video autoplay muted loop playsinline preload="auto" poster="/平台总览动画-蓝白版-poster.jpg">
          <source src="/平台总览动画-蓝白版.mp4" type="video/mp4" />
        </video>
      </div>
    </section>
  </body>
</html>
