<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>平台总览动画位置预览</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 32px;
        color: #061d45;
        font-family: "Microsoft YaHei", system-ui, sans-serif;
        background: #f5f8fc;
      }
      .preview-note { margin: 0 0 14px; font-size: 14px; color: #52657e; }
      .banner {
        position: relative;
        width: 100%;
        min-height: 280px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, .8);
        border-radius: 18px;
        background: #dcecff;
        box-shadow: 0 22px 54px rgba(15, 44, 92, .16);
      }
      .banner::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(90deg, rgba(232,242,255,.94) 0%, rgba(222,236,255,.66) 38%, rgba(218,235,255,.08) 72%);
      }
      .video-wrap {
        position: absolute;
        inset: 0 auto 0 0;
        width: 100%;
        overflow: hidden;
      }
      .video-wrap video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: left center;
      }
      .text {
        position: relative;
        z-index: 1;
        display: flex;
        min-height: 280px;
        padding: 28px 56px;
        align-items: center;
      }
      .text h1 { margin: 0; font-size: clamp(28px, 4vw, 48px); }
      .text p { margin: 14px 0 0; font-size: 16px; }
      @media (max-width: 640px) {
        body { padding: 16px; }
        .banner, .text { min-height: 240px; }
        .text { padding: 24px; }
      }
    </style>
  </head>
  <body>
    <p class="preview-note">预览：视频铺满横幅，左侧与横幅左边框对齐；超出横幅比例的区域会裁切。</p>
    <section class="banner">
      <div class="video-wrap">
        <video src="/平台总览动画.mp4" autoplay muted loop playsinline></video>
      </div>
      <div class="text">
        <div>
          <h1>福达 AI 视觉安全监管平台</h1>
          <p>平台总览横幅视频嵌入效果</p>
        </div>
      </div>
    </section>
  </body>
</html>
